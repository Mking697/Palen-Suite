<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Panel Calculator — Panel Suite</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="top">
      <div class="brand">
        <span class="brand-mark">PS</span>
        <span>
          <strong>Panel Calculator</strong>
          <small>dimensions in &rarr; drawings and BOQ out</small>
        </span>
      </div>

      <div class="job-fields">
        <label>Job No<input id="jobNo" type="text" value="HI-" /></label>
        <label>Density<span class="unit-tag">kg/m&sup3;</span><input id="density" type="number" value="40" /></label>
      </div>

      <div class="top-actions">
        <!-- File menu. Plain details/summary, so it opens and closes itself
             and needs no script to be a menu. -->
        <details class="menu" id="fileMenu">
          <summary class="btn">File</summary>
          <div class="menu-items">
            <button type="button" data-file="new">New</button>
            <button type="button" data-file="open">Open…</button>
            <button type="button" data-file="save">Save</button>
            <button type="button" data-file="saveAs">Save As…</button>
            <button type="button" data-file="delete" class="danger">Delete this job…</button>
          </div>
        </details>

        <!-- type a job number, or click for the list. The datalist is the
             browser's own, so this needs no library and no dropdown of ours. -->
        <input
          id="jobSearch"
          list="jobList"
          type="search"
          autocomplete="off"
          placeholder="Open job no…"
          title="Type a job number and press Enter"
        />
        <datalist id="jobList"></datalist>
        <span id="jobSearchMsg" class="top-msg"></span>
        <!-- a new tab, so a job half typed into the form is not lost -->
        <a class="btn" id="guideBtn" href="/guide" target="_blank" rel="noopener">Guide</a>
        <button class="btn" id="printBtn">Print</button>

        <details class="menu" id="accountMenu">
          <summary class="btn" id="accountBtn">Sign in</summary>
          <div class="menu-items account" id="accountPanel"></div>
        </details>
      </div>
    </header>

    <!-- Sign in first. app.js shows this whenever accounts are configured and
         nobody is signed in; with no Supabase configured it stays hidden and
         says so, because gating there would lock everyone out. -->
    <div class="gate" id="gate" hidden>
      <div class="gate-card">
        <span class="brand-mark">PS</span>
        <h1>Panel Suite</h1>
        <p class="gate-sub" id="gateSub">Sign in to draw a job and build its BOQ.</p>
        <div id="gateForm"></div>
      </div>
    </div>

    <!-- the administrator's screen, over the tool rather than beside it -->
    <div class="admin" id="admin" hidden>
      <div class="admin-head">
        <h2>Users</h2>
        <button class="btn" type="button" id="adminBack">&larr; Back to the calculator</button>
      </div>
      <div id="adminBody"></div>
    </div>

    <div class="app">
      <p class="gate-reason" id="gateReason"></p>
      <aside class="form" id="form"></aside>
      <main class="out" id="out">
        <p class="muted">Fill in a room to see its drawings and BOQ.</p>
      </main>
    </div>

    <!-- auth.js first: it puts `Auth` on window, and app.js uses it. Both are
         plain scripts so core/verify/web.test.ts can run them together. -->
    <script src="/auth.js"></script>
    <script type="module" src="/app.js"></script>
  </body>
</html>
